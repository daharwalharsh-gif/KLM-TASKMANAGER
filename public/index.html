<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>KLM Task Manager</title>
<link rel="icon" type="image/svg+xml" href="/invincible-logo.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet"/>
<style>
  /* ══════════════════════════════════════════════════════
     LOGIN — Harsh (7 Oct 2026): baayein ghoomta chakra (andar Invincible
     ke products gol ghoomte), daayein login card. Rang: ivory + gold/olive.
     ══════════════════════════════════════════════════════ */
  :root{
    --ivory:#f5f3ec; --paper:#fffdf8; --line:#e6dfcb;
    --gold:#b8a15a; --gold-2:#d6bf7a; --olive:#6f6c37; --olive-2:#8c8546;
    --ink:#1f1d16; --muted:#6f6a58; --soft:#a39b80;
  }
  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    font-family:'Inter',sans-serif;
    background:var(--ivory);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    overflow-x:hidden;
  }

  /* ── Peeche halki roshni ── */
  body::before, body::after {
    content:'';
    position:fixed;
    border-radius:50%;
    pointer-events:none;
    z-index:0;
  }
  body::before {
    width:680px;height:680px;
    top:-200px;left:-180px;
    background:radial-gradient(circle, rgba(222,224,194,.6), transparent 70%);
    animation: bgFloat1 9s ease-in-out infinite;
  }
  body::after {
    width:620px;height:620px;
    bottom:-220px;right:-180px;
    background:radial-gradient(circle, rgba(241,222,170,.55), transparent 70%);
    animation: bgFloat2 11s ease-in-out infinite;
  }
  @keyframes bgFloat1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(30px,20px)} }
  @keyframes bgFloat2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-20px,-30px)} }

  /* ── Do hisse: baayein chakra, daayein card ── */
  .split{
    position:relative;z-index:1;width:100%;min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    gap:clamp(40px,8vw,170px);padding:32px 24px;
  }

  /* ── Card ── */
  .login-wrap{
    background:var(--paper);
    border-radius:22px;
    padding:44px 38px 32px;
    width:420px;
    max-width:92vw;
    border:1px solid rgba(201,185,140,.45);
    box-shadow:0 30px 70px rgba(110,92,40,.13), 0 6px 18px rgba(110,92,40,.07);
    position:relative;
    z-index:1;
    overflow:hidden;
    animation: cardIn .75s cubic-bezier(.34,1.56,.64,1) .15s both;
  }
  /* Card ke upar patli sunehri patti — us par chalti chamak (sirf transform, halki) */
  .login-wrap::before{
    content:'';
    position:absolute;top:0;left:7%;right:7%;height:3px;border-radius:0 0 3px 3px;
    background:linear-gradient(90deg,rgba(111,108,55,0),#6f6c37 22%,#d6bf7a 50%,#6f6c37 78%,rgba(111,108,55,0));
  }
  .login-wrap::after{
    content:'';
    position:absolute;top:0;left:7%;width:26%;height:3px;z-index:2;pointer-events:none;
    background:linear-gradient(90deg,rgba(255,246,214,0),rgba(255,246,214,.95),rgba(255,246,214,0));
    animation:barShine 4s ease-in-out infinite;
  }
  @keyframes barShine{from{transform:translateX(-100%)}to{transform:translateX(330%)}}
  @media (max-width:480px){
    .login-wrap{ padding:30px 22px 24px; }
    .logo-img-wrap img{ width:160px; }
  }
  @keyframes cardIn {
    from { opacity:0; transform:translateX(40px) scale(.96); }
    to   { opacity:1; transform:none; }
  }

  /* ── Logo ── */
  .logo-section {
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:22px;
  }
  .logo-img-wrap {
    position:relative;
    display:inline-block;
    animation: logoIn .8s ease .3s both;
  }
  @keyframes logoIn {
    from { opacity:0; transform:translateY(-20px) scale(.9); }
    to   { opacity:1; transform:translateY(0)     scale(1);  }
  }
  .logo-img-wrap img {
    width:220px;
    display:block;
    filter: drop-shadow(0 4px 12px rgba(120,100,50,.14));
    animation: logoFloat 3.5s ease-in-out 1.2s infinite;
  }
  @keyframes logoFloat {
    0%,100% { transform:translateY(0px); }
    50%      { transform:translateY(-6px); }
  }
  /* Logo par chamak */
  .logo-img-wrap::after {
    content:'';
    position:absolute;
    top:0;left:-100%;
    width:60%;height:100%;
    background:linear-gradient(100deg, transparent 20%, rgba(255,253,248,.75) 50%, transparent 80%);
    animation: shimmer 2.5s ease .9s 2;
    pointer-events:none;
  }
  @keyframes shimmer {
    0%   { left:-100%; }
    100% { left:160%;  }
  }
  .logo-tagline {
    margin-top:12px;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:4px;
    color:#8a7a3c;
    text-transform:uppercase;
    animation: tagIn .5s ease 1s both;
  }
  @keyframes tagIn {
    from { opacity:0; transform:translateY(8px); }
    to   { opacity:1; transform:translateY(0); }
  }
  /* —— glove —— wali sajawat */
  .ornament{display:flex;align-items:center;gap:10px;width:62%;margin-top:12px}
  .ornament span{flex:1;height:1px;background:linear-gradient(90deg,rgba(216,203,163,0),#d8cba3);
    transform-origin:right center;animation:lineGrow .7s cubic-bezier(.2,.8,.2,1) 1.15s both}
  .ornament span:last-child{background:linear-gradient(90deg,#d8cba3,rgba(216,203,163,0));transform-origin:left center}
  .ornament svg{width:20px;height:15px;flex-shrink:0;animation:dotPop .5s cubic-bezier(.34,1.56,.64,1) 1.05s both}
  @keyframes lineGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes dotPop {
    0%  { opacity:0; transform:scale(0); }
    70% { transform:scale(1.35); }
    100%{ opacity:1; transform:scale(1); }
  }

  /* ── Form ── */
  h2{font-size:29px;font-weight:800;color:var(--ink);margin-bottom:6px;text-align:center;letter-spacing:-.6px;}
  h2 em{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:600;color:#b29a52;letter-spacing:0}
  p.sub{font-size:14px;color:var(--muted);margin-bottom:24px;text-align:center;}

  .form-group{margin-bottom:16px;}
  label{font-size:13px;font-weight:600;color:#2b2a22;display:block;margin-bottom:7px;}

  .input-wrap { position:relative; }
  .input-wrap .icon {
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:17px;height:17px;color:#9a947c;pointer-events:none;display:flex;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1),color .2s;
  }
  .input-wrap .icon svg{width:100%;height:100%}
  input{
    width:100%;
    padding:13px 14px 13px 42px;
    border:1px solid var(--line);
    border-radius:12px;
    font-size:14px;
    font-family:'Inter',sans-serif;
    outline:none;
    transition:border .2s, box-shadow .2s, background .2s;
    color:var(--ink);
    background:#fbf9f3;
  }
  input::placeholder{color:#aaa38c}
  #password{padding-right:46px}
  input:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 4px rgba(184,161,90,.16);
    background:#fff;
  }
  .input-wrap:focus-within .icon{transform:translateY(-50%) scale(1.15);color:#8a7a3c}
  .input-wrap.bad input{border-color:#d9583f;box-shadow:0 0 0 4px rgba(217,88,63,.13);background:#fff8f6}
  /* password dikhao / chhupao */
  .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:none;background:none;
    color:#9a947c;cursor:pointer;display:grid;place-items:center;border-radius:8px;transition:color .2s,background .2s}
  .eye:hover{color:var(--olive);background:rgba(184,161,90,.1)}
  .eye svg{width:18px;height:18px}
  .eye .slash{opacity:0;transition:opacity .2s}
  .eye.on .slash{opacity:1}

  .btn-login{
    position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;
    padding:14px;
    background:linear-gradient(135deg,#6b6936 0%,#8c8546 55%,#a39a55 100%);
    color:#fff;
    border:none;
    border-radius:14px;
    font-size:15.5px;
    font-weight:700;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    transition:transform .2s, box-shadow .2s, filter .2s;
    margin-top:8px;
    letter-spacing:.3px;
    box-shadow:0 12px 26px rgba(107,105,54,.28);
  }
  .btn-login:hover{
    transform:translateY(-2px);
    filter:brightness(.94);
    box-shadow:0 16px 32px rgba(107,105,54,.36);
  }
  .btn-login:active{ transform:translateY(0); }
  .btn-login::after{content:'';position:absolute;top:0;left:-70%;width:45%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .65s ease}
  .btn-login:hover::after{left:130%}
  .btn-glove{width:22px;height:18px;flex-shrink:0}
  .btn-login:hover .btn-glove{animation:jab .5s cubic-bezier(.3,.7,.2,1) infinite}
  @keyframes jab{0%,100%{transform:translateX(0)}35%{transform:translateX(-4px)}60%{transform:translateX(6px) scale(1.12)}}
  .btn-arrow{transition:transform .25s}
  .btn-login:hover .btn-arrow{transform:translateX(4px)}
  .btn-ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);
    animation:ripple .6s ease-out forwards;pointer-events:none}
  @keyframes ripple{to{transform:scale(4);opacity:0}}
  .btn-login.loading{pointer-events:none;filter:brightness(.9)}
  .btn-login.loading .btn-glove{animation:jab .35s cubic-bezier(.3,.7,.2,1) infinite}
  .btn-login.success{pointer-events:none;filter:none;background:linear-gradient(135deg,#5b7f3b,#46682c) !important;
    box-shadow:0 10px 26px rgba(70,104,44,.4) !important}

  .error{
    background:#fdf2ef;border:1px solid #f1cdc4;
    color:#b4351f;padding:10px 14px;
    border-radius:10px;font-size:13px;
    margin-bottom:14px;display:none;
  }
  .error.show{display:block !important;animation:errIn .3s cubic-bezier(.34,1.56,.64,1)}
  @keyframes errIn{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}

  .footer-text {
    text-align:center;
    font-size:11.5px;
    color:var(--soft);
    margin-top:20px;
  }
  .footer-text strong { color:#8a7a3c; }

  /* ── Card 3D jhukaav + chamak, form ek-ek karke ── */
  .tilt-stage{position:relative;z-index:1;width:420px;max-width:92vw;flex-shrink:0;
    transform:perspective(1100px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
    transition:transform .18s ease-out;will-change:transform}
  .tilt-stage .login-wrap{width:100%;max-width:100%}
  .card-glare{position:absolute;inset:0;pointer-events:none;z-index:0;border-radius:inherit;
    background:radial-gradient(420px circle at var(--gx,50%) var(--gy,-20%),rgba(214,188,112,.14),transparent 55%)}
  .login-wrap > *:not(.card-glare){position:relative;z-index:1}
  .login-wrap > h2{animation:riseIn .55s cubic-bezier(.2,.8,.2,1) .45s both}
  .login-wrap > p.sub{animation:riseIn .55s cubic-bezier(.2,.8,.2,1) .55s both}
  .login-wrap > .fg1{animation:riseIn .55s cubic-bezier(.2,.8,.2,1) .65s both}
  .login-wrap > .fg2{animation:riseIn .55s cubic-bezier(.2,.8,.2,1) .75s both}
  .login-wrap > .btn-login{animation:riseIn .55s cubic-bezier(.2,.8,.2,1) .88s both}
  .login-wrap > .footer-text{animation:riseIn .55s cubic-bezier(.2,.8,.2,1) 1s both}
  @keyframes riseIn{from{opacity:0;translate:0 16px}to{opacity:1;translate:0 0}}
  /* galat password: card hile */
  .login-wrap.shake{animation:shakeX .5s cubic-bezier(.36,.07,.19,.97) both}
  @keyframes shakeX{10%,90%{translate:-2px 0}20%,80%{translate:4px 0}30%,50%,70%{translate:-9px 0}40%,60%{translate:9px 0}}

  /* ══ CHAKRA — gol ghoomta, andar Invincible ke products ══ */
  .showcase{--S:clamp(320px,min(40vw,76vh),640px);position:relative;flex-shrink:0;
    display:flex;flex-direction:column;align-items:center;gap:20px}
  .wheel-stage{width:var(--S);height:var(--S);
    transform:perspective(1200px) rotateX(var(--wrx,0deg)) rotateY(var(--wry,0deg));transition:transform .35s ease-out}
  .wheel{position:relative;width:100%;height:100%;animation:wheelIn 1.3s cubic-bezier(.2,.85,.25,1.06) both}
  @keyframes wheelIn{from{opacity:0;scale:.7;rotate:-100deg}to{opacity:1;scale:1;rotate:0deg}}
  .wheel > *{position:absolute}
  @keyframes wSpin{to{transform:rotate(360deg)}}
  /* beech ki sunehri roshni */
  .w-glow{inset:20%;border-radius:50%;
    background:radial-gradient(circle,rgba(255,246,220,.95) 0%,rgba(238,216,152,.42) 42%,rgba(238,216,152,0) 70%);
    animation:glowPulse 4.5s ease-in-out infinite}
  @keyframes glowPulse{50%{scale:1.12;opacity:.8}}
  /* roshni ki kirnein */
  .w-rays{inset:3%;border-radius:50%;
    background:repeating-conic-gradient(from 0deg,rgba(214,188,112,0) 0deg,rgba(214,188,112,.32) 4deg,rgba(214,188,112,0) 8deg,rgba(214,188,112,0) 15deg);
    -webkit-mask:radial-gradient(circle,transparent 13%,#000 30%,#000 50%,transparent 71%);
            mask:radial-gradient(circle,transparent 13%,#000 30%,#000 50%,transparent 71%);
    animation:wSpin 140s linear infinite reverse}
  .w-svg{inset:0;width:100%;height:100%;overflow:visible}
  .w-petals{animation:wSpin 90s linear infinite}
  .w-ring{animation:wSpin 70s linear infinite reverse}
  /* products ka raasta + us par daudti chamak */
  .w-path,.w-comet,.w-chead{left:50%;top:50%;width:calc(var(--S) * .66);height:calc(var(--S) * .66);translate:-50% -50%;border-radius:50%}
  .w-path{border:1px dashed rgba(184,161,90,.5)}
  .w-path.p2{width:calc(var(--S) * .38);height:calc(var(--S) * .38);border-style:dotted;border-color:rgba(184,161,90,.55)}
  .w-comet{background:conic-gradient(from 0deg,rgba(184,161,90,0) 0 70%,rgba(184,161,90,.9) 100%);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));
            mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));
    animation:wSpin 6s linear infinite}
  .w-chead{animation:wSpin 6s linear infinite}
  .w-chead::after{content:'';position:absolute;left:50%;top:0;width:8px;height:8px;margin:-2.5px 0 0 -4px;border-radius:50%;
    background:#fff7de;box-shadow:0 0 12px 4px rgba(214,188,112,.95)}
  /* do orbit: bahar products (seedhe ghoomte), andar boxing ke chhote nishaan (ulte) */
  .orbit{left:0;top:0;width:100%;height:100%;animation:wSpin var(--d) linear infinite}
  .orbit.o1{--d:46s;--r:calc(var(--S) * .33);translate:calc(var(--hx,0px) * .45) calc(var(--hy,0px) * .45);transition:translate .35s ease-out}
  .orbit.o2{--d:30s;--r:calc(var(--S) * .19);animation-direction:reverse}
  .sat{position:absolute;left:50%;top:50%;width:0;height:0;transform:rotate(var(--a)) translateX(var(--r)) rotate(calc(var(--a) * -1))}
  .sat-in{position:absolute;left:0;top:0;translate:-50% -50%;animation:wSpin var(--d) linear infinite reverse}
  .o2 .sat-in{animation-direction:normal}
  .pop{animation:popIn .7s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(.55s + var(--i) * .1s)}
  @keyframes popIn{from{scale:0;opacity:0}to{scale:1;opacity:1}}
  .bob{animation:bob var(--b,4s) ease-in-out infinite alternate}
  @keyframes bob{from{transform:translateY(-6px) rotate(-6deg)}to{transform:translateY(6px) rotate(6deg)}}
  .o1 svg{display:block;overflow:visible;filter:drop-shadow(0 10px 14px rgba(70,58,25,.22));
    transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
  .o1 .sat-in:hover svg{transform:scale(1.18) rotate(-4deg)}
  .o2 svg{display:block;fill:none;stroke:#a8924f;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
  /* beech me Invincible ka sunehra nishaan */
  .hub{left:50%;top:50%;width:calc(var(--S) * .24);height:calc(var(--S) * .24);border-radius:50%;
    translate:calc(-50% + var(--hx,0px)) calc(-50% + var(--hy,0px));transition:translate .35s ease-out;
    background:radial-gradient(circle at 35% 28%,#fffdf5 0%,#f6ead0 55%,#e4cf96 100%);
    box-shadow:0 14px 34px rgba(120,95,35,.28),inset 0 0 0 1.5px rgba(184,161,90,.6),inset 0 -8px 18px rgba(150,120,50,.18);
    display:grid;place-items:center;animation:hubBreath 3.6s ease-in-out infinite}
  @keyframes hubBreath{50%{scale:1.05}}
  .hub::before,.hub::after{content:'';position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(184,161,90,.6);
    animation:hubPulse 3s ease-out infinite}
  .hub::after{animation-delay:1.5s}
  @keyframes hubPulse{from{transform:scale(1);opacity:.85}to{transform:scale(1.9);opacity:0}}
  .hub-mark{position:relative;overflow:hidden;width:66%;height:66%;
    background:linear-gradient(135deg,#7d6c2c 10%,#d6bc72 45%,#a88a3a 70%,#6f5f26 100%);
    -webkit-mask:url(/invincible-mark-white.svg) center/contain no-repeat;
            mask:url(/invincible-mark-white.svg) center/contain no-repeat}
  /* nishaan par chamak — sirf transform, halki */
  .hub-mark::after{content:'';position:absolute;top:0;bottom:0;left:0;width:45%;
    background:linear-gradient(100deg,rgba(255,243,207,0),rgba(255,243,207,.95),rgba(255,243,207,0));
    animation:markShine 4.5s ease-in-out infinite}
  @keyframes markShine{0%{transform:translateX(-120%)}55%,100%{transform:translateX(260%)}}
  .show-pill{font-size:13px;font-weight:600;color:#4f4b2e;padding:9px 18px;border:1px solid #ddd3b5;border-radius:999px;
    background:rgba(255,253,246,.75);letter-spacing:.2px;white-space:nowrap;animation:riseIn .6s ease 1.1s both}

  /* Phone/tablet: chakra upar chhota, card neeche */
  @media (max-width:959px){
    .split{flex-direction:column;gap:18px;padding:22px 16px}
    .showcase{--S:min(62vw,30vh,300px)}
    .show-pill{display:none}
  }

  /* ── Peeche halke tairte boxing ke nishaan ── */
  .equip{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .equip svg{
    position:absolute;bottom:-70px;fill:none;stroke:#a8924f;stroke-width:1.5;
    stroke-linecap:round;stroke-linejoin:round;
    animation:equipUp var(--dur) linear var(--delay) infinite;
  }
  @keyframes equipUp{
    from{transform:translateY(0) rotate(0deg);}
    to  {transform:translateY(calc(-100vh - 140px)) rotate(var(--rot));}
  }
  .equip{transition:transform .5s ease-out, opacity .8s ease;
    transform:translate(calc(var(--px,0px) * -.5),calc(var(--py,0px) * -.5))}

  /* ── BOOM (sahi login) ── */
  .boom-layer{position:fixed;inset:0;z-index:9999;pointer-events:none;overflow:hidden}
  .boom-flash{position:absolute;inset:0;background:#fffdf5;opacity:0}
  .boom-canvas{position:absolute;inset:0;width:100%;height:100%}
  .boom-ring{position:absolute;border-radius:50%;border:6px solid var(--gold);opacity:0;transform:translate(-50%,-50%) scale(.1)}
  .boom-glove{position:absolute;will-change:transform,opacity;filter:drop-shadow(0 14px 22px rgba(60,48,15,.38))}
  .boom-burst{position:absolute;transform:translate(-50%,-50%) scale(0)}
  .boom-text{position:absolute;transform:translate(-50%,-50%) scale(0);font:900 clamp(64px,13vw,170px)/1 Inter,Arial,sans-serif;
    letter-spacing:-2px;white-space:nowrap;color:#f3d77e;-webkit-text-stroke:5px #23211a;paint-order:stroke fill;
    text-shadow:7px 7px 0 #6f6c37,14px 14px 0 rgba(35,33,26,.25)}
  .boom-welcome{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:min(92vw,900px)}
  .boom-welcome .w1{font:800 clamp(13px,1.6vw,18px) Inter,Arial,sans-serif;letter-spacing:6px;color:#8a7a3c;opacity:0}
  .boom-welcome .w2{font:900 clamp(44px,8.5vw,110px)/1.05 Inter,Arial,sans-serif;letter-spacing:-2px;color:var(--ink);margin:10px 0 12px}
  .boom-welcome .w2 span{display:inline-block;opacity:0}
  .boom-welcome .w2 .nm{background:linear-gradient(90deg,#5f5d2f,#a8924f,#d6b25e);-webkit-background-clip:text;background-clip:text;color:transparent}
  .boom-welcome .w3{font:600 clamp(15px,1.8vw,21px) Inter,Arial,sans-serif;color:var(--muted);opacity:0}
  .boom-iris{position:absolute;left:50%;top:50%;border-radius:50%;background:var(--ivory);transform:translate(-50%,-50%) scale(0);
    box-shadow:0 0 0 14px rgba(184,161,90,.45),0 0 0 34px rgba(184,161,90,.18),0 0 90px 40px rgba(111,108,55,.2)}

<script>
// Agar already logged in hai toh seedha /app pe bhejo
(async function checkExistingSession() {
  try {
    const r = await fetch('/api/me', { credentials: 'include' });
    if (r.ok) { window.location.replace('/app'); }
  } catch(e) {}
})();

const REDUCED_MOTION = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
let _loginBusy = false;
// Browser "Back" se purana (BOOM ke baad wala khaali) page cache se laute to taaza khol do
window.addEventListener('pageshow', e => { if (e.persisted) window.location.reload(); });

function loginFail(msg, badFields) {
  const err = document.getElementById('err');
  const card = document.getElementById('loginCard');
  const btn = document.getElementById('btnLogin');
  btn.classList.remove('loading');
  btn.querySelector('.btn-label').textContent = 'Sign In';
  err.textContent = msg;
  err.classList.remove('show'); void err.offsetWidth; err.classList.add('show');
  card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  (badFields || []).forEach(id => {
    const w = document.getElementById(id).closest('.input-wrap');
    w.classList.add('bad');
    document.getElementById(id).addEventListener('input', () => w.classList.remove('bad'), { once: true });
  });
  _loginBusy = false;
}

async function login(ev){
  if (_loginBusy) return;
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const err=document.getElementById('err');
  const btn=document.getElementById('btnLogin');
  err.classList.remove('show'); err.style.display='none';
  // button par ripple (click ki jagah se)
  if (ev && ev.clientX && !REDUCED_MOTION) {
    const r0 = btn.getBoundingClientRect(), s = Math.max(r0.width, r0.height);
    const rp = document.createElement('span'); rp.className = 'btn-ripple';
    rp.style.cssText = `width:${s}px;height:${s}px;left:${ev.clientX - r0.left - s / 2}px;top:${ev.clientY - r0.top - s / 2}px`;
    btn.appendChild(rp); setTimeout(() => rp.remove(), 650);
  }
  if(!email||!password){ loginFail('Please fill all fields', [!email && 'email', !password && 'password'].filter(Boolean)); return; }
  _loginBusy = true;
  btn.classList.add('loading');
  btn.querySelector('.btn-label').textContent = 'Checking…';
  try{
    const req=fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({email,password})});
    audioWarm();   // awaaz ka engine jawab aane tak taiyaar — mukke ke waqt atke nahi
    const r=await req;
    const d=await r.json();
    if(!r.ok){ loginFail(d.error||'Login failed', ['password']); return; }
    // Token ko localStorage mein bhi save karo as backup (cookie block hone ki condition mein)
    if(d.token) localStorage.setItem('authToken', d.token);
    btn.classList.remove('loading'); btn.classList.add('success');
    btn.querySelector('.btn-label').textContent = 'Welcome!';
    // App pehle se laana shuru — BOOM ke beech download ho jaata hai
    try { const l = document.createElement('link'); l.rel = 'prefetch'; l.href = '/app'; document.head.appendChild(l); } catch (e) {}
    loginBoom(String(d.name || '').trim().split(/\s+/)[0] || '');
  }catch(e){ loginFail('Server error. Try again.'); }
}

// Password dikhao / chhupao
(function eyeToggle() {
  const b = document.getElementById('eyeBtn'), p = document.getElementById('password');
  if (!b || !p) return;
  b.addEventListener('click', () => {
    const show = p.type === 'password';
    p.type = show ? 'text' : 'password';
    b.classList.toggle('on', show);
    b.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    p.focus();
  });
})();

// ══ BOOM — sahi login par chakra tez ghoome, usme se glove ka mukka, BOOM!, confetti, phir app ══
function loginBoom(firstName) {
  const go = () => window.location.replace('/app');
  // Kuch bhi atke — app 3 second me zaroor khule
  const safety = setTimeout(go, 3200);
  if (REDUCED_MOTION) { setTimeout(go, 250); return; }
  try {
    const card = document.getElementById('loginCard');
    const show = document.getElementById('showcase');
    const rc = card.getBoundingClientRect();
    const cx = rc.left + rc.width / 2, cy = rc.top + rc.height / 2;
    const W = innerWidth, H = innerHeight;
    document.getElementById('tiltStage').style.setProperty('--rx', '0deg');
    document.getElementById('tiltStage').style.setProperty('--ry', '0deg');
    _tiltOff = true;

    // Chakra tez — jaise mukke ke liye zor laga raha ho
    try {
      document.getAnimations().forEach(a => {
        if (a.animationName === 'wSpin') { if (a.updatePlaybackRate) a.updatePlaybackRate(7); else a.playbackRate = 7; }
      });
    } catch (e) {}

    const layer = document.createElement('div'); layer.className = 'boom-layer';
    // phone par fixed layer kabhi screen se bada ban jaata hai — naap pakka screen jitna
    layer.style.cssText = `right:auto;bottom:auto;width:${W}px;height:${H}px`;
    layer.innerHTML = '<canvas class="boom-canvas"></canvas><div class="boom-flash"></div>';
    document.body.appendChild(layer);
    const flash = layer.querySelector('.boom-flash');
    const canvas = layer.querySelector('.boom-canvas');

    // 1. Glove — chakra ke beech se nikal kar card par (chakra baayein ho to), warna baayein se udta hua
    const gw = Math.min(W * 0.42, 420), gh = gw * 96 / 130;
    const glove = document.createElement('div'); glove.className = 'boom-glove';
    glove.style.cssText = `width:${gw}px;height:${gh}px;left:0;top:0`;
    glove.innerHTML = `<svg viewBox="0 0 130 96" width="${gw}" height="${gh}" style="overflow:visible"><use href="#gloveGold"/></svg>`;
    layer.appendChild(glove);
    const hitX = cx - gw * 0.92, hitY = cy - gh / 2;
    const hubEl = document.querySelector('#wheel .hub');
    const hr = hubEl ? hubEl.getBoundingClientRect() : null;
    const fromHub = hr && hr.width > 0 && (hr.left + hr.width / 2) < rc.left;
    const start = fromHub
      ? [{ transform: `translate(${hr.left + hr.width / 2 - gw / 2}px, ${hr.top + hr.height / 2 - gh / 2}px) rotate(-6deg) scale(.15)`, opacity: 0 },
         { transform: `translate(${hr.left + hr.width / 2 - gw / 2 + 30}px, ${hr.top + hr.height / 2 - gh / 2}px) rotate(-6deg) scale(.5)`, opacity: 1, offset: .3 }]
      : [{ transform: `translate(${-gw - 60}px, ${hitY + 40}px) rotate(-14deg) scale(.85)`, opacity: .6 }];
    glove.animate([
      ...start,
      { transform: `translate(${hitX - 40}px, ${hitY}px) rotate(-4deg) scale(1.05)`, opacity: 1, offset: .8 },
      { transform: `translate(${hitX}px, ${hitY}px) rotate(0deg) scale(1.18)`, opacity: 1 }
    ], { duration: 330, easing: 'cubic-bezier(.55,0,.9,.45)', fill: 'forwards' });
    if (fromHub) hubEl.animate([{ scale: '1' }, { scale: '1.3' }, { scale: '1' }], { duration: 330, easing: 'ease-out' });

    // 2. TAKKAR — awaaz, flash, screen hile, lehrein, BOOM!, confetti
    setTimeout(() => {
      punchSound();
      flash.animate([{ opacity: .95 }, { opacity: 0 }], { duration: 260, easing: 'ease-out', fill: 'forwards' });
      document.body.classList.add('shaking');
      setTimeout(() => document.body.classList.remove('shaking'), 460);
      // glove peeche jhatka khaaye aur gayab
      glove.animate([
        { transform: `translate(${hitX}px, ${hitY}px) scale(1.18)`, opacity: 1 },
        { transform: `translate(${hitX - gw * 0.35}px, ${hitY + 10}px) rotate(-8deg) scale(1.05)`, opacity: 1, offset: .35 },

      const txt = document.createElement('div'); txt.className = 'boom-text'; txt.textContent = 'BOOM!';

      a.onfinish = () => { clearTimeout(safety); go(); };
    }, 2050);
  } catch (e) { clearTimeout(safety); go(); }
}

// Confetti — sunehre/olive rang, takkar ki jagah se phatta hai
function confettiBurst(canvas, x0, y0) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
  const COLORS = ['#6f6c37', '#8c8546', '#b8a15a', '#d6bf7a', '#f3e2a6', '#2b2a24', '#ffffff', '#c97b3a'];
  const N = innerWidth < 700 ? 110 : 190;
  const P = [];
  for (let i = 0; i < N; i++) {
    const a = Math.random() * Math.PI * 2, sp = 6 + Math.random() * 15;
    P.push({ x: x0, y: y0, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 5, g: .32 + Math.random() * .18,
      w: 6 + Math.random() * 8, h: 4 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .5,
      c: COLORS[i % COLORS.length], shape: i % 7 === 0 ? 'star' : (i % 3 === 0 ? 'circle' : 'rect'), life: 1 });
  }
  const t0 = performance.now();
  (function frame(t) {
    const el = (t - t0) / 1000;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of P) {
      p.vx *= .985; p.vy = p.vy * .985 + p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      p.life = Math.max(0, 1 - Math.max(0, el - 1.1) / .7);
      ctx.save(); ctx.globalAlpha = p.life; ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if (p.c === '#ffffff') { ctx.strokeStyle = '#d8cba3'; ctx.lineWidth = 1; }
      if (p.shape === 'circle') { ctx.beginPath(); ctx.arc(0, 0, p.h * .6, 0, 7); ctx.fill(); }
      else if (p.shape === 'star') {
        ctx.beginPath(); for (let k = 0; k < 10; k++) { const rr = k % 2 ? 3.5 : 8.5, aa = k * Math.PI / 5; ctx.lineTo(Math.cos(aa) * rr, Math.sin(aa) * rr); }
        ctx.closePath(); ctx.fill();
      } else { ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); if (p.c === '#ffffff') ctx.strokeRect(-p.w / 2, -p.h / 2, p.w, p.h); }
      ctx.restore();
    }
    if (el < 1.9) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}

// "Dhamm" — chhoti si mukke ki awaaz (browser me hi bani, koi file nahi)
let _ac = null;
function audioWarm() {
  try {
    if (!_ac) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) _ac = new AC(); }
    if (_ac && _ac.state === 'suspended') _ac.resume();
  } catch (e) {}
}
function punchSound() {
  try {
    audioWarm();
    const ac = _ac; if (!ac) return;
    const now = ac.currentTime;
    const master = ac.createGain(); master.gain.value = 0.38; master.connect(ac.destination);
    const o = ac.createOscillator(), og = ac.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(150, now); o.frequency.exponentialRampToValueAtTime(42, now + 0.32);
    og.gain.setValueAtTime(1, now); og.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    o.connect(og); og.connect(master); o.start(now); o.stop(now + 0.42);
    const len = Math.floor(ac.sampleRate * 0.18), buf = ac.createBuffer(1, len, ac.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const ns = ac.createBufferSource(); ns.buffer = buf;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400;
    const ng = ac.createGain(); ng.gain.value = 0.55;
    ns.connect(lp); lp.connect(ng); ng.connect(master); ns.start(now);
  } catch (e) {}
}

// ── Card aur chakra mouse ke saath 3D jhukte hain + chamak + peeche ka saaman depth me ──
let _tiltOff = false;
(function tilt() {
  if (REDUCED_MOTION || !window.matchMedia || !matchMedia('(pointer:fine)').matches) return;
  const stage = document.getElementById('tiltStage'), card = document.getElementById('loginCard');
  const eq = document.getElementById('equip');
  const show = document.getElementById('showcase'), ws = document.getElementById('wheelStage');
  let raf = 0, mx = 0, my = 0;
  window.addEventListener('pointermove', e => {
    mx = e.clientX; my = e.clientY;
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      if (_tiltOff) return;
      const r = card.getBoundingClientRect();
      const dx = (mx - (r.left + r.width / 2)) / (innerWidth / 2), dy = (my - (r.top + r.height / 2)) / (innerHeight / 2);
      stage.style.setProperty('--ry', (dx * 6).toFixed(2) + 'deg');
      stage.style.setProperty('--rx', (-dy * 5).toFixed(2) + 'deg');
      card.style.setProperty('--gx', ((mx - r.left) / r.width * 100).toFixed(1) + '%');
      card.style.setProperty('--gy', ((my - r.top) / r.height * 100).toFixed(1) + '%');
      if (show && ws) {
        const wr = show.getBoundingClientRect();
        const wx = Math.max(-1, Math.min(1, (mx - (wr.left + wr.width / 2)) / (innerWidth / 2)));
        const wy = Math.max(-1, Math.min(1, (my - (wr.top + wr.height / 2)) / (innerHeight / 2)));
        ws.style.setProperty('--wry', (wx * 10).toFixed(2) + 'deg');
        ws.style.setProperty('--wrx', (-wy * 8).toFixed(2) + 'deg');
        ws.style.setProperty('--hx', (wx * 10).toFixed(1) + 'px');
        ws.style.setProperty('--hy', (wy * 10).toFixed(1) + 'px');
      }
      eq.style.setProperty('--px', (-dx * 22).toFixed(1) + 'px'); eq.style.setProperty('--py', (-dy * 16).toFixed(1) + 'px');
    });
  });
  document.addEventListener('pointerleave', () => {
    stage.style.setProperty('--rx', '0deg'); stage.style.setProperty('--ry', '0deg');
    if (ws) { ws.style.setProperty('--wrx', '0deg'); ws.style.setProperty('--wry', '0deg'); ws.style.setProperty('--hx', '0px'); ws.style.setProperty('--hy', '0px'); }
  });
})();
