<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>KLM Task Manager</title>
<link rel="icon" type="image/svg+xml" href="/invincible-logo.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    font-family:'Inter',sans-serif;
    background: linear-gradient(135deg,#eaf1ff 0%,#f1f5f9 50%,#f3f8ff 100%);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
  }

  /* ── Animated background circles ── */
  body::before, body::after {
    content:'';
    position:fixed;
    border-radius:50%;
    pointer-events:none;
    z-index:0;
  }
  body::before {
    width:400px;height:400px;
    top:-100px;left:-100px;
    background:radial-gradient(circle, #3b82f626, transparent 70%);
    animation: bgFloat1 8s ease-in-out infinite;
  }
  body::after {
    width:300px;height:300px;
    bottom:-80px;right:-80px;
    background:radial-gradient(circle, #1a56db1f, transparent 70%);
    animation: bgFloat2 10s ease-in-out infinite;
  }

  @keyframes bgFloat1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(30px,20px)} }
  @keyframes bgFloat2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-20px,-30px)} }

  /* ── Card ── */
  .login-wrap{
    background:#fff;
    border-radius:20px;
    padding:48px 40px 44px;
    width:420px;
    max-width:92vw;
    box-shadow:0 20px 60px rgba(26,86,219,.12), 0 4px 20px rgba(0,0,0,.08);
    position:relative;
    z-index:1;
    overflow:hidden;
    animation: cardIn .6s cubic-bezier(.34,1.56,.64,1) both;
  }
  /* Card ke upar tricolor accent bar — logo ke colours se match */
  .login-wrap::before{
    content:'';
    position:absolute;top:0;left:0;right:0;height:6px;
    background:linear-gradient(90deg,#1a56db 0%,#3b82f6 55%,#60a5fa 100%);
  }
  /* Mobile: card padding kam taaki chhoti screen par theek dikhe */
  @media (max-width:480px){
    .login-wrap{ padding:30px 22px; }
    .logo-img-wrap img{ width:160px; }
  }
  @keyframes cardIn {
    from { opacity:0; transform:translateY(30px) scale(.96); }
    to   { opacity:1; transform:translateY(0)    scale(1);   }
  }

  /* ── Logo section ── */
  .logo-section {
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:28px;
  }

  .logo-img-wrap {
    position:relative;
    display:inline-block;
    animation: logoIn .8s ease .2s both;
  }
  @keyframes logoIn {
    from { opacity:0; transform:translateY(-20px) scale(.9); }
    to   { opacity:1; transform:translateY(0)     scale(1);  }
  }

  .logo-img-wrap img {
    width:230px;
    display:block;
    filter: drop-shadow(0 4px 14px rgba(26,86,219,.18));
    animation: logoFloat 3.5s ease-in-out 1s infinite;
  }
  @keyframes logoFloat {
    0%,100% { transform:translateY(0px);   filter:drop-shadow(0 4px 14px rgba(26,86,219,.18)); }
    50%      { transform:translateY(-7px); filter:drop-shadow(0 12px 22px rgba(59,130,246,.28));  }
  }

  /* Shimmer sweep over logo */
  .logo-img-wrap::after {
    content:'';
    position:absolute;
    top:0;left:-100%;
    width:60%;height:100%;
    background:linear-gradient(100deg, transparent 20%, rgba(255,255,255,.7) 50%, transparent 80%);
    animation: shimmer 2.5s ease .8s 2;
    pointer-events:none;
  }
  @keyframes shimmer {
    0%   { left:-100%; }
    100% { left:160%;  }
  }

  .logo-tagline {
    margin-top:12px;
    font-size:12px;
    font-weight:700;
    letter-spacing:3px;
    color:#1a56db;
    text-transform:uppercase;
    animation: tagIn .5s ease .9s both;
  }
  @keyframes tagIn {
    from { opacity:0; transform:translateY(8px); }
    to   { opacity:1; transform:translateY(0); }
  }

  /* Decorative dots */
  .logo-dots {
    display:flex;gap:6px;margin-top:8px;
    animation: fadeIn .4s ease 1.2s both;
  }
  .logo-dots span {
    width:5px;height:5px;border-radius:50%;
    animation: dotPop .4s ease both;
  }
  .logo-dots span:nth-child(1){ background:#f57c00; animation-delay:1.2s; }
  .logo-dots span:nth-child(2){ background:#1a1a1a; animation-delay:1.35s;}
  .logo-dots span:nth-child(3){ background:#2e7d32; animation-delay:1.5s; }
  @keyframes dotPop {
    0%  { opacity:0; transform:scale(0); }
    70% { transform:scale(1.4); }
    100%{ opacity:1; transform:scale(1); }
  }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }

  /* ── Form ── */
  h2{font-size:21px;font-weight:700;color:#1e293b;margin-bottom:4px;text-align:center;}
  p.sub{font-size:13px;color:#64748b;margin-bottom:24px;text-align:center;}

  .form-group{margin-bottom:16px;}
  label{font-size:12px;font-weight:600;color:#374151;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}

  .input-wrap { position:relative; }
  .input-wrap .icon {
    position:absolute;left:12px;top:50%;transform:translateY(-50%);
    font-size:15px;color:#94a3b8;pointer-events:none;
  }
  input{
    width:100%;
    padding:11px 14px 11px 38px;
    border:1.5px solid #e2e8f0;
    border-radius:10px;
    font-size:14px;
    font-family:'Inter',sans-serif;
    outline:none;
    transition:border .2s, box-shadow .2s;
    color:#1e293b;
    background:#fafafa;
  }
  input:focus{
    border-color:#3b82f6;
    box-shadow:0 0 0 3px rgba(59,130,246,.15);
    background:#fff;
  }

  .btn-login{
    width:100%;
    padding:13px;
    background:linear-gradient(135deg,#3b82f6,#1a56db);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:15px;
    font-weight:700;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    transition:all .2s;
    margin-top:6px;
    letter-spacing:.3px;
    box-shadow:0 4px 16px rgba(26,86,219,.30);
  }
  .btn-login:hover{
    transform:translateY(-2px);
    background:linear-gradient(135deg,#1a56db,#1648c0);
    box-shadow:0 8px 24px rgba(26,86,219,.38);
  }
  .btn-login:active{ transform:translateY(0); }

  .error{
    background:#fef2f2;border:1px solid #fecaca;
    color:#dc2626;padding:10px 14px;
    border-radius:8px;font-size:13px;
    margin-bottom:14px;display:none;
  }

  /* ── Divider ── */
  .divider {
    display:flex;align-items:center;gap:10px;
    margin:20px 0 16px;
  }
  .divider::before,.divider::after {
    content:'';flex:1;height:1px;background:#e2e8f0;
  }
  .divider span { font-size:11px;color:#94a3b8;white-space:nowrap; }

  /* ── Footer ── */
  .footer-text {
    text-align:center;
    font-size:11px;
    color:#94a3b8;
    margin-top:20px;
  }
  .footer-text strong { color:#1a56db; }

  /* ══════════════════════════════════════════════════════
     BOXING — card ke dono taraf ki khaali jagah me.
     Invincible boxing ka saaman banata hai: uske gloves, T-shirt
     aur punching bag dono taraf ghoomte-tairte hain, peeche halke
     icons. Card ko chhuta nahi.
     ══════════════════════════════════════════════════════ */
  .equip{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .equip svg{
    position:absolute;bottom:-70px;fill:none;stroke:#1a56db;stroke-width:1.5;
    stroke-linecap:round;stroke-linejoin:round;
    animation:equipUp var(--dur) linear var(--delay) infinite;
  }
  @keyframes equipUp{
    from{transform:translateY(0) rotate(0deg);}
    to  {transform:translateY(calc(-100vh - 140px)) rotate(var(--rot));}
  }

  /* Ghoomte hue Invincible gloves, T-shirt, punching bag (card ke dono taraf) */
  .floaters{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .fl{position:absolute;bottom:-190px;animation:flRise var(--dur) linear var(--delay) infinite;}
  .fl-sway{animation:flSway var(--sway) ease-in-out infinite alternate;}
  .fl-spin{animation:flSpin var(--spin) linear infinite;animation-direction:var(--dir);}
  .fl svg{display:block;overflow:visible;filter:drop-shadow(0 10px 16px rgba(15,23,42,.18));}
  @keyframes flRise{from{transform:translateY(0)}to{transform:translateY(calc(-100vh - 380px))}}
  @keyframes flSway{from{transform:translateX(-28px)}to{transform:translateX(28px)}}
  @keyframes flSpin{to{transform:rotate(360deg)}}

  @media (prefers-reduced-motion:reduce){
    .equip,.floaters{display:none;}
  }

  /* ══════════════════════════════════════════════════════
     LOGIN ANIMATION — Harsh (7 Oct 2026): "login karte hi BOOM, maja aa jaye"
     Sirf login page. Card mouse ke saath 3D jhukta hai, peeche ka saaman
     depth me khiskta hai, sahi login par glove ka mukka + BOOM + confetti.
     ══════════════════════════════════════════════════════ */
  .tilt-stage{position:relative;z-index:1;width:420px;max-width:92vw;
    transform:perspective(1100px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
    transition:transform .18s ease-out;will-change:transform}
  .tilt-stage .login-wrap{width:100%;max-width:100%}
  .card-glare{position:absolute;inset:0;pointer-events:none;z-index:0;border-radius:inherit;
    background:radial-gradient(420px circle at var(--gx,50%) var(--gy,-20%),rgba(59,130,246,.12),transparent 55%);
    transition:opacity .3s}
  .login-wrap > *:not(.card-glare){position:relative;z-index:1}
  /* upar ki patti me chalti chamak */
  .login-wrap::before{background:linear-gradient(90deg,#1a56db,#60a5fa,#1a56db,#3b82f6,#1a56db) !important;
    background-size:300% 100% !important;animation:barFlow 4s linear infinite}
  @keyframes barFlow{to{background-position:-300% 0}}
  /* form ek-ek karke */
  .login-wrap > h2{animation:riseIn .55s cubic-bezier(.2,.8,.2,1) .35s both}
  .login-wrap > p.sub{animation:riseIn .55s cubic-bezier(.2,.8,.2,1) .45s both}
  .login-wrap > .fg1{animation:riseIn .55s cubic-bezier(.2,.8,.2,1) .55s both}
  .login-wrap > .fg2{animation:riseIn .55s cubic-bezier(.2,.8,.2,1) .65s both}
  .login-wrap > .btn-login{animation:riseIn .55s cubic-bezier(.2,.8,.2,1) .78s both}
  .login-wrap > .footer-text{animation:riseIn .55s cubic-bezier(.2,.8,.2,1) .9s both}
  @keyframes riseIn{from{opacity:0;translate:0 16px}to{opacity:1;translate:0 0}}
  /* input focus par icon jaage */
  .input-wrap .icon{transition:transform .25s cubic-bezier(.34,1.56,.64,1),color .2s}
  .input-wrap:focus-within .icon{transform:translateY(-50%) scale(1.25);color:#1a56db}
  .input-wrap.bad input{border-color:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.15);background:#fff7f7}
  /* Sign In button: chamak, glove, ripple, loading, success */
  .btn-login{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px}
  .btn-login::after{content:'';position:absolute;top:0;left:-70%;width:45%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .65s ease}
  .btn-login:hover::after{left:130%}
  .btn-glove{width:22px;height:18px;flex-shrink:0;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
  .btn-login:hover .btn-glove{animation:jab .5s cubic-bezier(.3,.7,.2,1) infinite}
  @keyframes jab{0%,100%{transform:translateX(0)}35%{transform:translateX(-4px)}60%{transform:translateX(6px) scale(1.12)}}
  .btn-arrow{transition:transform .25s}
  .btn-login:hover .btn-arrow{transform:translateX(4px)}
  .btn-ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);
    animation:ripple .6s ease-out forwards;pointer-events:none}
  @keyframes ripple{to{transform:scale(4);opacity:0}}
  .btn-login.loading{pointer-events:none;background:linear-gradient(135deg,#1a56db,#1648c0)}
  .btn-login.loading .btn-glove{animation:jab .35s cubic-bezier(.3,.7,.2,1) infinite}
  .btn-login.success{pointer-events:none;background:linear-gradient(135deg,#16a34a,#15803d) !important;
    box-shadow:0 8px 26px rgba(22,163,74,.45) !important}
  /* galat password: card hile */
  .login-wrap.shake{animation:shakeX .5s cubic-bezier(.36,.07,.19,.97) both}
  @keyframes shakeX{10%,90%{translate:-2px 0}20%,80%{translate:4px 0}30%,50%,70%{translate:-9px 0}40%,60%{translate:9px 0}}
  .error.show{display:block !important;animation:errIn .3s cubic-bezier(.34,1.56,.64,1)}
  @keyframes errIn{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
  /* peeche ka saaman — mouse ke ulta thoda khiske (depth) */
  .floaters,.equip{transition:transform .5s ease-out, opacity .8s ease}
  .floaters{transform:translate(var(--px,0px),var(--py,0px))}
  .equip{transform:translate(calc(var(--px,0px) * -.5),calc(var(--py,0px) * -.5))}

  /* ── BOOM (sahi login) ── */
  .boom-layer{position:fixed;inset:0;z-index:9999;pointer-events:none;overflow:hidden}
  .boom-flash{position:absolute;inset:0;background:#fff;opacity:0}
  .boom-canvas{position:absolute;inset:0;width:100%;height:100%}
  .boom-ring{position:absolute;border-radius:50%;border:6px solid #3b82f6;opacity:0;transform:translate(-50%,-50%) scale(.1)}
  .boom-glove{position:absolute;will-change:transform,opacity;filter:drop-shadow(0 14px 22px rgba(15,23,42,.38))}
  .boom-burst{position:absolute;transform:translate(-50%,-50%) scale(0)}
  .boom-text{position:absolute;transform:translate(-50%,-50%) scale(0);font:900 clamp(64px,13vw,170px)/1 Inter,Arial,sans-serif;
    letter-spacing:-2px;white-space:nowrap;color:#facc15;-webkit-text-stroke:5px #0f172a;paint-order:stroke fill;
    text-shadow:7px 7px 0 #1a56db,14px 14px 0 rgba(15,23,42,.25)}
  .boom-welcome{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:min(92vw,900px)}
  .boom-welcome .w1{font:800 clamp(13px,1.6vw,18px) Inter,Arial,sans-serif;letter-spacing:6px;color:#3b82f6;opacity:0}
  .boom-welcome .w2{font:900 clamp(44px,8.5vw,110px)/1.05 Inter,Arial,sans-serif;letter-spacing:-2px;color:#0f172a;margin:10px 0 12px}
  .boom-welcome .w2 span{display:inline-block;opacity:0}
  .boom-welcome .w2 .nm{background:linear-gradient(90deg,#1a56db,#3b82f6,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent}
  .boom-welcome .w3{font:600 clamp(15px,1.8vw,21px) Inter,Arial,sans-serif;color:#475569;opacity:0}
  .boom-iris{position:absolute;left:50%;top:50%;border-radius:50%;background:#f1f5f9;transform:translate(-50%,-50%) scale(0);
    box-shadow:0 0 0 14px rgba(59,130,246,.45),0 0 0 34px rgba(59,130,246,.18),0 0 90px 40px rgba(26,86,219,.25)}
  body.ko .floaters,body.ko .equip{transform:scale(1.5) !important;opacity:0}
  .login-wrap.ko{animation:koOut .75s cubic-bezier(.55,.05,.6,.4) forwards}
  @keyframes koOut{0%{transform:none}18%{transform:translateX(26px) rotate(4deg) scale(1.02)}
    100%{transform:translate(120vw,-26vh) rotate(38deg) scale(.55);opacity:0}}
  body.shaking .tilt-stage,body.shaking .floaters,body.shaking .equip{animation:screenShake .45s cubic-bezier(.36,.07,.19,.97)}
  @keyframes screenShake{10%,90%{translate:-3px 2px}20%,80%{translate:6px -4px}30%,50%,70%{translate:-10px 6px}40%,60%{translate:10px -6px}}
  @media (prefers-reduced-motion:reduce){
    .tilt-stage{transform:none !important}
    .login-wrap > *{animation:none !important}
  }
</style>
</head>

<!-- ══ Boxing ka saaman (sirf sajawat, click nahi pakadta) ══ -->

      <text x="60" y="64" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="900" textLength="60" lengthAdjust="spacingAndGlyphs" fill="#fff">INVINCIBLE</text>
      <rect x="44" y="69" width="15" height="2.5" rx="1" fill="#f57c00"/><rect x="61" y="69" width="15" height="2.5" rx="1" fill="#22c55e"/>
    </symbol>
    <symbol id="teeBlue" viewBox="0 0 120 110" overflow="visible">
      <path d="M38 6 L16 16 L2 40 L20 50 L28 42 L28 104 L92 104 L92 42 L100 50 L118 40 L104 16 L82 6 C78 16 70 22 60 22 C50 22 42 16 38 6 Z" fill="url(#bxTeeBlue)"/>
      <path d="M38 6 C42 16 50 22 60 22 C70 22 78 16 82 6" stroke="#1e3a8a" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M6 33 L22 43 M114 33 L98 43" stroke="#fff" stroke-opacity=".2" stroke-width="2"/>
      <image href="/invincible-mark-white.svg" x="49" y="27" width="22" height="22"/>
      <text x="60" y="64" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="900" textLength="60" lengthAdjust="spacingAndGlyphs" fill="#fff">INVINCIBLE</text>
      <rect x="44" y="69" width="15" height="2.5" rx="1" fill="#f57c00"/><rect x="61" y="69" width="15" height="2.5" rx="1" fill="#22c55e"/>
    </symbol>
    <symbol id="teeWhite" viewBox="0 0 120 110" overflow="visible">

<script>
// Agar already logged in hai toh seedha /app pe bhejo
(async function checkExistingSession() {
  try {
    const r = await fetch('/api/me', { credentials: 'include' });
    if (r.ok) { window.location.replace('/app'); }
  } catch(e) {}
})();

const REDUCED_MOTION = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
let _loginBusy = false;

function loginFail(msg, badFields) {
  const err = document.getElementById('err');
  const card = document.getElementById('loginCard');
  const btn = document.getElementById('btnLogin');
  btn.classList.remove('loading');
  btn.querySelector('.btn-label').textContent = 'Sign In';
  err.textContent = msg;
  err.classList.remove('show'); void err.offsetWidth; err.classList.add('show');
  card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  (badFields || []).forEach(id => {
    const w = document.getElementById(id).closest('.input-wrap');
    w.classList.add('bad');
    document.getElementById(id).addEventListener('input', () => w.classList.remove('bad'), { once: true });
  });
  _loginBusy = false;
}

async function login(ev){
  if (_loginBusy) return;
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const err=document.getElementById('err');
  const btn=document.getElementById('btnLogin');
  err.classList.remove('show'); err.style.display='none';
  // button par ripple (click ki jagah se)
  if (ev && ev.clientX && !REDUCED_MOTION) {
    const r0 = btn.getBoundingClientRect(), s = Math.max(r0.width, r0.height);
    const rp = document.createElement('span'); rp.className = 'btn-ripple';
    rp.style.cssText = `width:${s}px;height:${s}px;left:${ev.clientX - r0.left - s / 2}px;top:${ev.clientY - r0.top - s / 2}px`;
    btn.appendChild(rp); setTimeout(() => rp.remove(), 650);
  }
  if(!email||!password){ loginFail('Please fill all fields', [!email && 'email', !password && 'password'].filter(Boolean)); return; }
  _loginBusy = true;
  btn.classList.add('loading');
  btn.querySelector('.btn-label').textContent = 'Checking…';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({email,password})});
    const d=await r.json();
    if(!r.ok){ loginFail(d.error||'Login failed', ['password']); return; }
    // Token ko localStorage mein bhi save karo as backup (cookie block hone ki condition mein)
    if(d.token) localStorage.setItem('authToken', d.token);
    btn.classList.remove('loading'); btn.classList.add('success');
    btn.querySelector('.btn-label').textContent = 'Welcome!';
    // App pehle se laana shuru — BOOM ke beech download ho jaata hai
    try { const l = document.createElement('link'); l.rel = 'prefetch'; l.href = '/app'; document.head.appendChild(l); } catch (e) {}
    loginBoom(String(d.name || '').trim().split(/\s+/)[0] || '');
  }catch(e){ loginFail('Server error. Try again.'); }
}

// ══ BOOM — sahi login par glove ka mukka, BOOM!, confetti, phir app ══
function loginBoom(firstName) {
  const go = () => window.location.replace('/app');
  // Kuch bhi atke — app 3 second me zaroor khule

    const card = document.getElementById('loginCard');

    const flash = layer.querySelector('.boom-flash');
    const canvas = layer.querySelector('.boom-canvas');

    // 1. Glove baayein se udta hua card par
    const gw = Math.min(W * 0.42, 420), gh = gw * 96 / 130;

    layer.appendChild(glove);
    const hitX = cx - gw * 0.92, hitY = cy - gh / 2;
    glove.animate([
      { transform: `translate(${-gw - 60}px, ${hitY + 40}px) rotate(-14deg) scale(.85)`, opacity: .6 },
      { transform: `translate(${hitX - 40}px, ${hitY}px) rotate(-4deg) scale(1.05)`, opacity: 1, offset: .8 },
      { transform: `translate(${hitX}px, ${hitY}px) rotate(0deg) scale(1.18)`, opacity: 1 }
    ], { duration: 330, easing: 'cubic-bezier(.55,0,.9,.45)', fill: 'forwards' });

    // 2. TAKKAR — awaaz, flash, screen hile, lehrein, BOOM!, confetti
    setTimeout(() => {
      punchSound();
      flash.animate([{ opacity: .95 }, { opacity: 0 }], { duration: 260, easing: 'ease-out', fill: 'forwards' });
      document.body.classList.add('shaking');
      setTimeout(() => document.body.classList.remove('shaking'), 460);
      // glove peeche jhatka khaaye aur gayab
      glove.animate([
        { transform: `translate(${hitX}px, ${hitY}px) scale(1.18)`, opacity: 1 },
        { transform: `translate(${hitX - gw * 0.35}px, ${hitY + 10}px) rotate(-8deg) scale(1.05)`, opacity: 1, offset: .35 },
        { transform: `translate(${-gw - 80}px, ${hitY + 60}px) rotate(-20deg) scale(.8)`, opacity: 0 }
      ], { duration: 700, delay: 60, easing: 'cubic-bezier(.3,.7,.3,1)', fill: 'forwards' });
      // lehrein
      [0, 90, 190].forEach((dl, i) => {
        const ring = document.createElement('div'); ring.className = 'boom-ring';
        const s = Math.max(W, H) * (0.55 + i * 0.25);
        ring.style.cssText = `width:${s}px;height:${s}px;left:${cx}px;top:${cy}px;border-color:${['#3b82f6', '#f59e0b', '#22c55e'][i]}`;
        layer.appendChild(ring);
        ring.animate([{ transform: 'translate(-50%,-50%) scale(.05)', opacity: .9 }, { transform: 'translate(-50%,-50%) scale(1)', opacity: 0 }],
          { duration: 750, delay: dl, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' });
      });
      // comic tara + BOOM!
      const bs = Math.min(W, H) * 0.62;
      const burst = document.createElement('div'); burst.className = 'boom-burst';
      burst.style.cssText = `left:${cx}px;top:${cy}px;width:${bs}px;height:${bs}px`;
      const pts = []; for (let i = 0; i < 28; i++) { const a = i / 28 * Math.PI * 2, rr = i % 2 ? 0.62 : 1; pts.push((50 + Math.cos(a) * 50 * rr).toFixed(1) + ',' + (50 + Math.sin(a) * 50 * rr).toFixed(1)); }
      burst.innerHTML = `<svg viewBox="0 0 100 100" width="${bs}" height="${bs}"><polygon points="${pts.join(' ')}" fill="#fde047" stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round"/>` +
        `<polygon points="${pts.join(' ')}" fill="#f97316" transform="translate(50 50) scale(.72) translate(-50 -50)"/></svg>`;
      layer.appendChild(burst);
      burst.animate([
        { transform: 'translate(-50%,-50%) scale(0) rotate(-30deg)', opacity: 1 },
        { transform: 'translate(-50%,-50%) scale(1.15) rotate(6deg)', opacity: 1, offset: .25 },
        { transform: 'translate(-50%,-50%) scale(1) rotate(0deg)', opacity: 1, offset: .55 },
        { transform: 'translate(-50%,-50%) scale(1.3) rotate(10deg)', opacity: 0 }
      ], { duration: 950, easing: 'cubic-bezier(.34,1.56,.64,1)', fill: 'forwards' });
      const txt = document.createElement('div'); txt.className = 'boom-text'; txt.textContent = 'BOOM!';
      txt.style.cssText = `left:${cx}px;top:${cy}px`;
      layer.appendChild(txt);
      txt.animate([
        { transform: 'translate(-50%,-50%) scale(0) rotate(-18deg)', opacity: 1 },
        { transform: 'translate(-50%,-50%) scale(1.35) rotate(-6deg)', opacity: 1, offset: .25 },
        { transform: 'translate(-50%,-50%) scale(1) rotate(-8deg)', opacity: 1, offset: .5 },
        { transform: 'translate(-50%,-50%) scale(1.08) rotate(-8deg)', opacity: 1, offset: .78 },
        { transform: 'translate(-50%,-50%) scale(1.6) rotate(-8deg)', opacity: 0 }
      ], { duration: 1000, easing: 'cubic-bezier(.34,1.56,.64,1)', fill: 'forwards' });
      confettiBurst(canvas, cx, cy);
      // card knock-out, peeche ka saaman bikhre
      card.classList.add('ko');
      document.body.classList.add('ko');
    }, 330);

    // 3. WELCOME, NAAM!
    setTimeout(() => {
      const wel = document.createElement('div'); wel.className = 'boom-welcome';
      const name = (firstName || 'Champ').toUpperCase() + '!';
      wel.innerHTML = '<div class="w1">WELCOME BACK</div><div class="w2"></div><div class="w3">Let\'s crush today\'s tasks 🥊</div>';
      const w2 = wel.querySelector('.w2');
      [...name].forEach((ch, i) => {
        const s = document.createElement('span');
        s.className = 'nm'; s.textContent = ch === ' ' ? ' ' : ch;
        w2.appendChild(s);
        s.animate([{ opacity: 0, transform: 'translateY(-60px) rotate(-12deg) scale(.6)' },
                   { opacity: 1, transform: 'translateY(6px) rotate(2deg) scale(1.08)', offset: .7 },
                   { opacity: 1, transform: 'none' }],
          { duration: 420, delay: 60 + i * 45, easing: 'cubic-bezier(.34,1.56,.64,1)', fill: 'forwards' });
      });
      layer.appendChild(wel);
      wel.querySelector('.w1').animate([{ opacity: 0, letterSpacing: '18px' }, { opacity: 1, letterSpacing: '6px' }], { duration: 450, fill: 'forwards', easing: 'ease-out' });
      wel.querySelector('.w3').animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 450, delay: 380, fill: 'forwards', easing: 'ease-out' });
    }, 1050);

    // 4. App ki taraf — gol pardah failta hai, phir /app
    setTimeout(() => {
      const wel = layer.querySelector('.boom-welcome');
      if (wel) wel.animate([{ transform: 'translate(-50%,-50%) scale(1)', opacity: 1 }, { transform: 'translate(-50%,-50%) scale(.9)', opacity: 0 }], { duration: 320, fill: 'forwards', easing: 'ease-in' });
      const iris = document.createElement('div'); iris.className = 'boom-iris';
      const d = Math.hypot(W, H) * 1.15;
      iris.style.width = iris.style.height = d + 'px';
      layer.appendChild(iris);
      const a = iris.animate([{ transform: 'translate(-50%,-50%) scale(0)' }, { transform: 'translate(-50%,-50%) scale(1)' }],
        { duration: 460, easing: 'cubic-bezier(.6,0,.35,1)', fill: 'forwards' });

    }, 2050);
  } catch (e) { clearTimeout(safety); go(); }
}

// Confetti — brand ke rang, takkar ki jagah se phatta hai
function confettiBurst(canvas, x0, y0) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
  const COLORS = ['#1a56db', '#3b82f6', '#60a5fa', '#f57c00', '#facc15', '#22c55e', '#ffffff', '#ef4444'];
  const N = innerWidth < 700 ? 110 : 190;
  const P = [];
  for (let i = 0; i < N; i++) {
    const a = Math.random() * Math.PI * 2, sp = 6 + Math.random() * 15;
    P.push({ x: x0, y: y0, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 5, g: .32 + Math.random() * .18,
      w: 6 + Math.random() * 8, h: 4 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .5,
      c: COLORS[i % COLORS.length], shape: i % 7 === 0 ? 'star' : (i % 3 === 0 ? 'circle' : 'rect'), life: 1 });
  }
  const t0 = performance.now();
  (function frame(t) {
    const el = (t - t0) / 1000;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of P) {
      p.vx *= .985; p.vy = p.vy * .985 + p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      p.life = Math.max(0, 1 - Math.max(0, el - 1.1) / .7);
      ctx.save(); ctx.globalAlpha = p.life; ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if (p.c === '#ffffff') { ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1; }
      if (p.shape === 'circle') { ctx.beginPath(); ctx.arc(0, 0, p.h * .6, 0, 7); ctx.fill(); }
      else if (p.shape === 'star') {
        ctx.beginPath(); for (let k = 0; k < 10; k++) { const rr = k % 2 ? 3.5 : 8.5, aa = k * Math.PI / 5; ctx.lineTo(Math.cos(aa) * rr, Math.sin(aa) * rr); }
        ctx.closePath(); ctx.fill();
      } else { ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); if (p.c === '#ffffff') ctx.strokeRect(-p.w / 2, -p.h / 2, p.w, p.h); }
      ctx.restore();
    }
    if (el < 1.9) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}

// "Dhamm" — chhoti si mukke ki awaaz (browser me hi bani, koi file nahi)
function punchSound() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ac = new AC(), now = ac.currentTime;
    const master = ac.createGain(); master.gain.value = 0.38; master.connect(ac.destination);
    const o = ac.createOscillator(), og = ac.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(150, now); o.frequency.exponentialRampToValueAtTime(42, now + 0.32);
    og.gain.setValueAtTime(1, now); og.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    o.connect(og); og.connect(master); o.start(now); o.stop(now + 0.42);
    const len = Math.floor(ac.sampleRate * 0.18), buf = ac.createBuffer(1, len, ac.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const ns = ac.createBufferSource(); ns.buffer = buf;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400;
    const ng = ac.createGain(); ng.gain.value = 0.55;
    ns.connect(lp); lp.connect(ng); ng.connect(master); ns.start(now);
    setTimeout(() => { try { ac.close(); } catch (e) {} }, 800);
  } catch (e) {}
}

// ── Card mouse ke saath 3D jhukta hai + chamak + peeche ka saaman depth me ──
let _tiltOff = false;
(function tilt() {
  if (REDUCED_MOTION || !window.matchMedia || !matchMedia('(pointer:fine)').matches) return;
  const stage = document.getElementById('tiltStage'), card = document.getElementById('loginCard');
  const fl = document.getElementById('floaters'), eq = document.getElementById('equip');
  let raf = 0, mx = 0, my = 0;
  window.addEventListener('pointermove', e => {
    mx = e.clientX; my = e.clientY;
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      if (_tiltOff) return;
      const r = card.getBoundingClientRect();
      const dx = (mx - (r.left + r.width / 2)) / (innerWidth / 2), dy = (my - (r.top + r.height / 2)) / (innerHeight / 2);
      stage.style.setProperty('--ry', (dx * 6).toFixed(2) + 'deg');
      stage.style.setProperty('--rx', (-dy * 5).toFixed(2) + 'deg');
      card.style.setProperty('--gx', ((mx - r.left) / r.width * 100).toFixed(1) + '%');
      card.style.setProperty('--gy', ((my - r.top) / r.height * 100).toFixed(1) + '%');
      fl.style.setProperty('--px', (-dx * 22).toFixed(1) + 'px'); fl.style.setProperty('--py', (-dy * 16).toFixed(1) + 'px');
      eq.style.setProperty('--px', (-dx * 22).toFixed(1) + 'px'); eq.style.setProperty('--py', (-dy * 16).toFixed(1) + 'px');
    });
  });
  document.addEventListener('pointerleave', () => { stage.style.setProperty('--rx', '0deg'); stage.style.setProperty('--ry', '0deg'); });
})();

// ── Ghoomte-tairte Invincible gloves, T-shirt aur punching bag (dono taraf ki khaali jagah me) ──
(function floaters() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const KINDS = [
    { id: 'teeNavy',   vb: '0 0 120 110', w: [100, 128] },
    { id: 'gloveBlue', vb: '0 0 130 96',  w: [76, 98] },
    { id: 'teeBlue',   vb: '0 0 120 110', w: [100, 128] },
    { id: 'gloveNavy', vb: '0 0 130 96',  w: [76, 98] },
    { id: 'teeWhite',  vb: '0 0 120 110', w: [100, 128] },
    { id: 'bagItem',   vb: '0 0 100 280', w: [46, 58] }
  ];
  const wide = window.innerWidth >= 1000;
  const n = wide ? 14 : 6;
  const box = document.getElementById('floaters');
  for (let i = 0; i < n; i++) {
    const k = KINDS[i % KINDS.length];
    // Badi screen par sirf dono kinaaron ki patti me, card ke peeche nahi
    const x = !wide ? Math.random() * 88
      : (Math.floor(i / 2) % 2 ? 72 + Math.random() * 22 : 2 + Math.random() * 22);
    const w = k.w[0] + Math.random() * (k.w[1] - k.w[0]);
    const dur = 30 + Math.random() * 16;
    const el = document.createElement('div');
    el.className = 'fl';
    el.style.left = x + 'vw';
    el.style.setProperty('--dur', dur + 's');
    el.style.setProperty('--delay', (-(i / n) * dur - Math.random() * 3) + 's');
    el.innerHTML =
      `<div class="fl-sway" style="--sway:${(3 + Math.random() * 2.5).toFixed(1)}s">` +
      `<div class="fl-spin" style="--spin:${(24 + Math.random() * 14).toFixed(1)}s;--dir:${i % 3 ? 'normal' : 'reverse'}">` +
      `<svg viewBox="${k.vb}" width="${w.toFixed(0)}" style="opacity:${wide ? .9 : .35}"><use href="#${k.id}"/></svg>` +
      `</div></div>`;
    box.appendChild(el);
  }
})();

(function equip() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const ICONS = [
    // Boxing glove
    'M7 21v-3.2C5 16.6 4 14.5 4 12V8.5A4.5 4.5 0 0 1 8.5 4h4.2A5.3 5.3 0 0 1 18 9.3v2.2c0 2.6-1.3 4.6-3 5.7V21H7z M4.3 11.2c2 .4 4-.3 5.2-2.2 M7 18h8',

    'M12 3C7.6 3 4 6.6 4 11v5c0 1.7 1.3 3 3 3h1.5v-6H6.5V11a5.5 5.5 0 0 1 11 0v2h-2v6H17c1.7 0 3-1.3 3-3v-5c0-4.4-3.6-8-8-8z M9 8.5h6',
    // Mouthguard
    'M4 9c0 5 3.5 8 8 8s8-3 8-8c-2.5 1.2-5.2 1.8-8 1.8S6.5 10.2 4 9z M8 12.5v1 M12 13v1 M16 12.5v1',

    // Punching bag
    'M12 2v3 M8 5h8 M8 5c-1.7 0-3 1.3-3 3v10c0 1.7 1.3 3 3 3h8c1.7 0 3-1.3 3-3V8c0-1.7-1.3-3-3-3 M5 9h14 M5 17h14',
    // Shorts
    'M5 4h14l1.2 15H14l-2-7.5L10 19H3.8L5 4z M5.2 7h13.6',
    // Trophy
    'M8 4h8v5a4 4 0 0 1-8 0V4z M8 6H5a3 3 0 0 0 3 4 M16 6h3a3 3 0 0 1-3 4 M12 13v4 M9 20h6 M10 17h4v3h-4z'
  ];
  const box = document.getElementById('equip');
  const n = window.innerWidth < 700 ? 8 : 16;
  for (let i = 0; i < n; i++) {
    const size = 24 + Math.random() * 28;
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 24 24');
    s.style.width = s.style.height = size + 'px';
    s.style.left = (Math.random() * 96) + 'vw';
    s.style.opacity = (.08 + Math.random() * .08).toFixed(2);
    const dur = 22 + Math.random() * 18;
    s.style.setProperty('--dur', dur + 's');
    s.style.setProperty('--delay', (-Math.random() * dur) + 's');
    s.style.setProperty('--rot', ((Math.random() - .5) * 120) + 'deg');
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', ICONS[i % ICONS.length]);
    s.appendChild(p);
    box.appendChild(s);
  }
})();

// Tyohaar ke din (Holidays list me aaj ki chhutti) — "Happy …" + logo
(async function festival() {
  try {
    if (!window.KLMFestival) return;
    const pre = KLMFestival.preview();
    let names = pre ? [pre] : [];
    if (!pre) {
      // Holidays list ke saath apna tyohaar calendar bhi (list me na ho tab bhi badhai)
      let listNames = [], date = '';
      try {
        const d = await (await fetch('/api/holiday-today')).json();
        listNames = (d && d.names) || [];
        date = (d && d.date) || '';
      } catch (e) {}
      names = KLMFestival.todayNames(listNames, date);
    }
    if (names.length) document.getElementById('festBanner').innerHTML = KLMFestival.html(names, 'block');
  } catch (e) {}
})();
</script>
