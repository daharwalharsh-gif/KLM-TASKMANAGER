name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

# Ek waqt me ek hi deploy chale; naya push purane ko rok de
concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Production deploy
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to production
        id: deploy
        run: |
          url=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Check the site is up
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://klm-taskmanager-xi.vercel.app/app.html)
            if [ "$code" = "200" ]; then echo "app.html OK (HTTP 200)"; exit 0; fi
            echo "try $i: HTTP $code"
            sleep 10
          done
          echo "Site did not come up"; exit 1
